            var rr2 = ringAge * RING_SPEED;
            if (Math.abs(horiz - rr2) < .07 && i2 !== SCAN_HEAD) HEAT[i2] = 1;
          }
        }
        HEAT[i2] *= Math.exp(-dt*1.6);
        var x1 = px2*cosY + pz2*sinY, z1 = -px2*sinY + pz2*cosY;
        var y2b = py2*cosP - z1*sinP, z2b = py2*sinP + z1*cosP;
        var f2 = 3.2/Math.max(.30, 3.2 - z2b*.85);   /* clamp past the lens */
        proj[i2] = [cx + x1*R*f2, cy - y2b*R*f2];
        depth[i2] = Math.min(2.2, z2b);
      }
      x.clearRect(0,0,CW,CH); x.lineCap='round';
      var fadeAll = isFly ? Math.max(0, 1-Math.max(0,(holdT-4.6)/1.0))
                          : (flyEnd ? Math.min(1, u*1.5) : 1);
      var edgeDim = (isLidar && !inMorph) ? .35 : 1;
      var drgBoost = (isDrg || (inMorph && (A===S_DRG || B===S_DRG))) ? 1.7 : 1;

      function drawEdges(S, alphaMul) {
        if (alphaMul <= .01) return;
        for (var e3 = 0; e3 < S.edges.length; e3++) {
          var ed = S.edges[e3], a3 = proj[ed[0]], b3 = proj[ed[1]];
          var dq = ((depth[ed[0]]+depth[ed[1]])/2+1)/2;
          x.globalAlpha = Math.min(1, (0.05+.45*dq*dq)*ed[2]*alphaMul*fadeAll*edgeDim*drgBoost);
          x.lineWidth = (drgBoost>1 ? .7 : .5)+.75*Math.min(2, dq);
          x.strokeStyle = ink;
          x.beginPath(); x.moveTo(a3[0],a3[1]); x.lineTo(b3[0],b3[1]); x.stroke();
        }
      }
      if (inMorph) { drawEdges(A, Math.max(0,1-u/.3)); drawEdges(B, outQuart(Math.max(0,(u-.7)/.3))); }
      else drawEdges(A, 1);

      if (isLidar && !inMorph && SCAN_HEAD >= 0) {
        var tt2 = holdT % RING_PERIOD, nring2 = Math.floor(holdT / RING_PERIOD);
        for (var rg2 = 0; rg2 < 3; rg2++) {
          if (nring2 - rg2 < 0) continue;
          var age2 = tt2 + rg2*RING_PERIOD;
          if (age2 > RING_LIFE) continue;
          var rad2 = age2 * RING_SPEED;
          var ringAlpha = .55 * Math.max(0, 1 - age2/RING_LIFE);
          x.globalAlpha = ringAlpha; x.strokeStyle = accent; x.lineWidth = 1.2;
          x.beginPath();
          for (var sg2 = 0; sg2 <= 56; sg2++) {
            var an2 = sg2/56*6.2832;
            var wx = SCAN_POS[0] + Math.cos(an2)*rad2, wz = SCAN_POS[2] + Math.sin(an2)*rad2;
            var wy = FLOOR_Y + .005;
            var x1r = wx*cosY + wz*sinY, z1r = -wx*sinY + wz*cosY;
            var y2r = wy*cosP - z1r*sinP, z2r = wy*sinP + z1r*cosP;
            var fr2 = 3.2/(3.2 - z2r*.85);
            var sxr = cx + x1r*R*fr2, syr = cy - y2r*R*fr2;
            sg2 ? x.lineTo(sxr, syr) : x.moveTo(sxr, syr);
          }
          x.stroke();
        }
        var hp = proj[SCAN_HEAD];
        x.globalAlpha = .9; x.fillStyle = accent;
        x.beginPath(); x.arc(hp[0], hp[1], 2.4 + Math.sin(now/160)*.8, 0, 6.2832); x.fill();
      }

      for (i2 = 0; i2 < P; i2++) {
        var dq2 = (depth[i2]+1)/2, isAcc = A.acc.indexOf(i2) >= 0;
        var h = HEAT[i2];
        var isSurf = (A === S_ROOMF) && i2 >= SURF_START;
        var base2 = (isLidar && !inMorph) ? (isSurf ? .05+.22*dq2*dq2 : .04+.18*dq2*dq2)
                    : (isSurf ? .04+.16*dq2*dq2 : .08+.45*dq2*dq2);
        var al = ((isAcc ? .3+.7*dq2 : base2) + h*.95)*drgBoost;
        x.globalAlpha = Math.min(1, al)*fadeAll;
        x.fillStyle = (isAcc || h > .3) ? accent : ink;
        if (isAcc) {
          var rad3 = 1.35 + .8*dq2;
          x.beginPath(); x.arc(proj[i2][0], proj[i2][1], rad3, 0, 6.2832); x.fill();
        } else {
          var sz2 = .45 + .75*dq2;              /* heat never changes size, only light */
          x.fillRect(proj[i2][0]-sz2*.5, proj[i2][1]-sz2*.5, sz2, sz2);
        }
      }
      if (!REDUCED) raf = requestAnimationFrame(frame);
    }
    addEventListener('resize', size);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) cancelAnimationFrame(raf);
      else { last = performance.now(); raf = requestAnimationFrame(frame); }
    });
    new MutationObserver(palette).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
    palette();
    requestAnimationFrame(function () {          /* box depends on late layout */
      size();
      if (REDUCED) { born = performance.now()-16000; frame(performance.now()); }
      else raf = requestAnimationFrame(frame);
    });
    if (document.fonts) document.fonts.ready.then(function () {
      size(); if (REDUCED) frame(performance.now());
    });
  })();
  </script>
