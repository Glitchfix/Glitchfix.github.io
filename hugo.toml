baseURL = 'https://glitchfix.github.io/'
languageCode = 'en-us'
title = 'glitchfix'
enableRobotsTXT = true
timeZone = 'Asia/Taipei'
disableKinds = ['taxonomy', 'term']

[services.googleAnalytics]
ID = 'G-GPBS5WVPT5'

[params]
description = 'Notes by Shivanjan Chakravorty on GPU performance engineering: ML training and inference, physics simulation, and robot learning.'
author = 'Shivanjan Chakravorty'
email = 'schakravorty846@gmail.com'
github = 'https://github.com/Glitchfix'
linkedin = 'https://www.linkedin.com/in/shivanjan'
researchgate = 'https://www.researchgate.net/profile/Shivanjan-Chakravorty'

[outputFormats.llms]
mediaType = 'text/plain'
baseName = 'llms'
isPlainText = true

[outputFormats.llmsfull]
mediaType = 'text/plain'
baseName = 'llms-full'
isPlainText = true

[outputs]
home = ['html', 'rss', 'llms', 'llmsfull']

[permalinks]
blog = '/blog/:contentbasename/'

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
codeFences = true

[[menus.main]]
